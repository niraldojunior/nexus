name: Docker (VPS)

# CI de deploy para o VPS: valida o docker-compose, constrói as duas imagens
# (api e web) e — fora de PR — publica no GitHub Container Registry (GHCR) para
# o VPS puxar. Complementa o ci.yml (lint/typecheck/build/test), não o substitui.

on:
  push:
    branches: ['main', 'feat/docker-vps-migration']
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Caddyfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.env.docker.example'
      - '.github/workflows/docker.yml'
      - 'src/**'
      - 'web/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # Renderiza o compose para garantir que a fiação (serviços, rede externa,
  # perfis, healthcheck) está válida antes de construir qualquer imagem.
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materializar .env.docker a partir do exemplo
        run: cp .env.docker.example .env.docker
      - name: Validar docker-compose.yml
        run: docker compose config --quiet

  build:
    needs: validate-compose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api
            image: nexus-api
          - target: web
            image: nexus-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Publica só quando não é PR (push em branch/tag ou disparo manual).
      - name: Login no GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (e push fora de PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          # O bundle do Vite precisa dessas vars em build. VITE_AUTH_TOKEN deve
          # casar com o AUTH_TOKEN do backend no VPS; defina-as como secrets do
          # repositório. Sem secret, caem no default (dev/paridade Vercel).
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_AUTH_TOKEN=${{ secrets.VITE_AUTH_TOKEN }}
