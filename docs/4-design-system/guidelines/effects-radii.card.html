<!-- @dsCard group="Effects" viewport="820x150" name="Radii" subtitle="10px base. 6 chips · 8 controls · 10 cards · 14 popovers · 18 floating panels · full pills." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-card); font-family: var(--font-ui); }
  .row { display: flex; gap: 18px; align-items: center; }
  .item { text-align: center; }
  .box { width: 82px; height: 62px; background: var(--surface-muted); border: 1px solid var(--border-strong); }
  .v { font: var(--text-label); color: var(--text-primary); margin-top: 8px; }
  .t { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="v">6px</div><div class="t">radius-sm</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="v">8px</div><div class="t">radius-md</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="v">10px</div><div class="t">radius-lg</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="v">14px</div><div class="t">radius-xl</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="v">18px</div><div class="t">radius-2xl</div></div>
    <div class="item"><div class="box" style="width:112px;border-radius:var(--radius-full)"></div><div class="v">full</div><div class="t">radius-full</div></div>
  </div>
</body>
</html>
