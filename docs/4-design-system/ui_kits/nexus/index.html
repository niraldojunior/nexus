<!-- @startingPoint section="V.tal Nexus" subtitle="Network inventory app — full interactive shell" viewport="1440x900" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V.tal Nexus — Inventário de Redes</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { height: 100%; margin: 0; }
  #app { height: 100vh; }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="./data.js"></script>
  <script type="text/babel" src="./shared.jsx"></script>
  <script type="text/babel" src="./Shell.jsx"></script>
  <script type="text/babel" src="./Login.jsx"></script>
  <script type="text/babel" src="./Dashboard.jsx"></script>
  <script type="text/babel" src="./Inventory.jsx"></script>
  <script type="text/babel" src="./Viability.jsx"></script>
  <script type="text/babel" src="./Topology.jsx"></script>
  <script type="text/babel" src="./Assistant.jsx"></script>
  <script type="text/babel" src="./Locais.jsx"></script>
  <script type="text/babel">
    const { Button, Input } = window.VTalNexusDesignSystem_63587b;

    const TITLES = {
      dashboard: { t: 'Visão Geral', s: 'Inventário de Redes · São Paulo, Rio de Janeiro +3' },
      inventory: { t: 'Inventário', s: 'Recursos de rede · TMF639 Resource Inventory' },
      viability: { t: 'Viabilidade', s: 'Motor fuzzy de viabilidade por endereço' },
      topology: { t: 'Topologia', s: 'Caminho óptico fim a fim · CTO-4821' },
    };
    // Screens with no fixed header — chat views and the map own their own chrome.
    const BARE = { new: 1, thread: 1, chats: 1, locais: 1 };
    const RAIL = { locais: 1 };

    function App() {
      const [authed, setAuthed] = React.useState(false);
      const [screen, setScreen] = React.useState('dashboard');

      if (!authed) return <Login onLogin={() => { setAuthed(true); setScreen('dashboard'); }} />;

      const meta = TITLES[screen] || { t: 'V.tal Nexus', s: '' };
      const bare = !!BARE[screen];

      let body;
      if (screen === 'dashboard') body = <Dashboard onNavigate={setScreen} />;
      else if (screen === 'inventory') body = <Inventory onNavigate={setScreen} />;
      else if (screen === 'viability') body = <Viability />;
      else if (screen === 'topology') body = <Topology />;
      else if (screen === 'new') body = <NewConversation onSend={() => setScreen('thread')} />;
      else if (screen === 'thread') body = <ConversationThread onDelete={() => setScreen('chats')} />;
      else if (screen === 'chats') body = <ConversationHistory onOpen={() => setScreen('thread')} />;
      else if (screen === 'locais') body = <Locais rail={true} />;
      else body = <Placeholder name={meta.t} />;

      return (
        <Shell key={RAIL[screen] ? 'rail' : 'sidebar'} active={screen} onNavigate={setScreen} onLogout={() => setAuthed(false)} variant={RAIL[screen] ? 'rail' : 'sidebar'} pad={!bare}>
          {!bare && <PageHead title={meta.t} subtitle={meta.s} />}
          {body}
        </Shell>
      );
    }

    function Placeholder({ name }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12, height: 360, color: 'var(--text-tertiary)' }}>
          <Icon name="hammer" size={32} />
          <div style={{ fontSize: 15, fontWeight: 600 }}>{name}</div>
          <div style={{ fontSize: 13 }}>Módulo em construção neste UI kit.</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
